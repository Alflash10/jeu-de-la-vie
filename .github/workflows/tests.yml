name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Ruff
        run: ruff check --output-format=github .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Écran virtuel pour les tests de l'interface Tkinter
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb
      - name: Lancer les tests
        env:
          EXIGER_TK: "1"
        run: xvfb-run -a python -m unittest discover -s tests -t . -v
      - name: Installer le paquet et essayer la commande
        run: |
          pip install .
          cd /tmp && jeu-de-la-vie simuler planeur -n 4 --afficher
